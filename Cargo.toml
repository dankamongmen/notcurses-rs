[package]
name = "notcurses"
version = "3.5.0"
edition = "2021"
rust-version = "1.65.0" # sync with README.md, check.sh & .github/workflows/check.yml
authors = ["José Luis Cruz <joseluis@andamira.net>", "nick black <dankamongmen@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A high level Rust wrapper for the notcurses C library"
repository = "https://github.com/dankamongmen/notcurses-rs"
homepage = "https://nick-black.com/dankwiki/index.php/Notcurses"
readme = "./README.md"
categories = [
	"api-bindings",
	"command-line-interface",
	"visualization",
	"rendering",
]
keywords = ["tui", "cli", "terminal", "ncurses"]
include = [
	"/src/**/*rs",
	"/examples/hello-world.rs",
	"/Cargo.toml",
	"/LICENSE-*",
	"/README.md",
]
publish = true

[features]
default = []

nightly_docs = ["vendored"]
vendored = ['libnotcurses-sys/use_vendored_bindings']

[dependencies]
libnotcurses-sys = { version = "3.10.1", features = ["std"] } # notcurses v3.0.9
# libnotcurses-sys = { path = "../libnotcurses-sys", features = ["std"] } # master

once_cell = "1.20.1"
paste = "1.0.15"
rgb = { version = "0.8.50", default-features = false }
cuadra = "0.3.0"

[dev-dependencies]
rand = "0.8"

[package.metadata.docs.rs]
features = ["nightly_docs"]

[badges]
maintenance = { status = "actively-developed" }
